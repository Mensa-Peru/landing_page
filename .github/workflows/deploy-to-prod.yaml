name: Deploy to Production

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies and build site
        run: npm ci && npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}
    name: Test site deployment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Build completed successfully"

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Deploy site to production
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2213 -H mensa.pe >> ~/.ssh/known_hosts

      - name: Deploy using rsync over SSH
        run: |
          rsync -avz --delete --ignore-errors \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2213" \
            dist/ ubuntu@mensa.pe:/var/www/html

      - name: Reload Nginx on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 2213 ubuntu@mensa.pe \
            'sudo /usr/bin/systemctl reload nginx'
