name: Deploy to Production

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches: [ dev ]

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}
    name: Test site deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies and build site
        run: npm ci && npm run build

      - run: echo "Deploying is successful"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Deploy site to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies and build site
        run: npm ci && npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2213 -H mensa.pe >> ~/.ssh/known_hosts

      - name: Deploy using rsync over SSH
        run: |
          rsync -avz --delete --ignore-errors \
            -e "ssh -i ~/.ssh/id_ed25519 -p 2213" \
            dist/ ubuntu@mensa.pe:/var/www/html

      - name: Reload Nginx on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 2213 ubuntu@mensa.pe \
            'sudo /usr/bin/systemctl reload nginx'
